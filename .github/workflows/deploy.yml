name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create env file
        working-directory: frontend
        run: |
          echo "REACT_APP_BACKEND_URL=https://marche-cache.emergent.host" > .env
          echo "REACT_APP_BACKEND_URL=https://marche-cache.emergent.host" > .env.production
          echo "REACT_APP_BACKEND_URL=https://marche-cache.emergent.host" > .env.local
          cat .env
          echo "--- Files created ---"
          ls -la .env*

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      - name: Build
        working-directory: frontend
        run: REACT_APP_BACKEND_URL=https://marche-cache.emergent.host CI=false yarn build

      - name: Verify build output
        working-directory: frontend
        run: |
          BUNDLE=$(ls build/static/js/main.*.js)
          echo "Bundle: $BUNDLE"
          grep -oP 'REACT_APP_BACKEND_URL:"[^"]*"' "$BUNDLE" || echo "NOT FOUND"
          grep -c "marche-cache" "$BUNDLE" && echo "marche-cache found" || echo "marche-cache NOT found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
